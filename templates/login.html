<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — AutoService CRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body class="login-page"><div class="login-card"><div class="login-logo"><i class="bi bi-wrench-adjustable"></i></div><div class="brand-login">AUTO<span>SERVICE</span></div><p class="login-sub">СИСТЕМА УПРАВЛЕНИЯ АВТОСЕРВИСОМ</p><h1>С возвращением</h1><p class="text-muted mb-4">Войдите в рабочее пространство</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><label class="form-label">Логин</label><input class="form-control mb-3" name="username" required value="{{ request.form.get('username','') }}"><label class="form-label">Пароль</label><input class="form-control mb-4" name="password" type="password" required><button class="btn btn-primary w-100 py-2">Войти в систему <i class="bi bi-arrow-right ms-2"></i></button></form><div class="demo-hint">Демо-доступ: <b>admin</b> / <b>admin123</b></div></div></body></html>
